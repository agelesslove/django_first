{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title> Blog</title>
        <link rel="stylesheet" href="{% static 'css/blog.css' %}">
    </head>
    <body>
        <header>
            <h1><a href="">Dark Django Blog</a></h1>
        </header>

        <main style="max-width: 800px; margin: 40px auto;">
            {% for post in posts %}
                <article class="post">
                    <time class="date">published: {{ post.published_date }}</time>
                    <h2><a href="">{{ post.title }}</a></h2>
                    <p class="text">{{ post.text|linebreaksbr }}</p>
                </article>
            {% endfor %}
        </main>
    </body>
</html>
